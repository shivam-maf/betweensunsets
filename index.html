<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Between Sunsets — Coming Soon</title>
  <meta name="description" content="A curated multi-designer fashion platform. Coming soon to betweensunsets.ae" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --terracotta:  #b5522a;
      --terracotta-lt:#c86740;
      --rose:        #9e5068;
      --rose-lt:     #b86a82;
      --gold:        #b8924a;
      --gold-lt:     #cda968;
      --gold-pale:   #e8d4a8;
      --blush:       #e8c4b0;
      --cream:       #fdf8f3;
      --warm-white:  #fffaf6;
      --text-dark:   #2c1810;
      --text-mid:    #6b3d2e;
    }

    html, body { height: 100%; width: 100%; }

    body {
      font-family: 'Raleway', sans-serif;
      background-color: var(--warm-white);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 55% at 50% -10%,  rgba(232,196,176,0.32) 0%, transparent 65%),
        radial-gradient(ellipse 55% 40% at 95% 95%,   rgba(184,146,74,0.13)  0%, transparent 55%),
        radial-gradient(ellipse 45% 45% at 5%  85%,   rgba(158,80,104,0.09)  0%, transparent 55%),
        var(--warm-white);
    }

    /* Corner ornaments */
    .corner { position: fixed; width: 110px; height: 110px; opacity: 0.16; z-index: 1; }
    .corner svg { width: 100%; height: 100%; }
    .corner--tl { top: 20px; left: 20px; }
    .corner--tr { top: 20px; right: 20px; transform: scaleX(-1); }
    .corner--bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
    .corner--br { bottom: 20px; right: 20px; transform: scale(-1); }

    .wrapper {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      padding: 3rem 2rem;
      max-width: 860px; width: 100%;
    }

    .sun-icon {
      width: 80px; height: 58px;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeDown 1s ease forwards 0.2s;
    }

    .wordmark {
      display: flex; align-items: baseline;
      justify-content: center; gap: 0.18em;
      flex-wrap: wrap; line-height: 1;
      opacity: 0;
      animation: fadeUp 1.1s ease forwards 0.5s;
    }

    .word-between {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: clamp(3rem, 9vw, 7.6rem);
      color: var(--terracotta);
      letter-spacing: -0.01em;
    }

    .word-sunsets {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: clamp(3rem, 9vw, 7.6rem);
      color: var(--rose);
      letter-spacing: -0.01em;
    }

    .tagline {
      margin-top: 0.9rem;
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: clamp(0.55rem, 1.4vw, 0.7rem);
      letter-spacing: 0.33em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.85s;
    }

    .divider {
      display: flex; align-items: center; gap: 0.9rem;
      margin: 2.4rem 0;
      width: 300px; max-width: 78%;
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.1s;
    }
    .divider-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-lt), transparent);
    }
    .divider-diamond {
      width: 5px; height: 5px;
      background: var(--gold-lt);
      transform: rotate(45deg); flex-shrink: 0;
    }

    .coming-soon {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: clamp(1.05rem, 2.8vw, 1.5rem);
      color: var(--text-mid);
      letter-spacing: 0.03em; line-height: 1.7;
      max-width: 500px;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1.2s;
    }

    .signup-block {
      margin-top: 2.6rem;
      display: flex; flex-direction: column;
      align-items: center; gap: 0.8rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1.45s;
    }

    .signup-label {
      font-family: 'Raleway', sans-serif;
      font-weight: 200; font-size: 0.62rem;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--gold);
    }

    .signup-row {
      display: flex; gap: 0;
      border: 1px solid var(--blush);
      background: rgba(255,250,246,0.95);
      overflow: hidden;
      width: 340px; max-width: 88vw;
    }

    .signup-row input {
      flex: 1; border: none; outline: none;
      padding: 0.75rem 1rem;
      font-family: 'Raleway', sans-serif;
      font-weight: 300; font-size: 0.75rem;
      letter-spacing: 0.06em;
      background: transparent; color: var(--text-dark);
    }
    .signup-row input::placeholder { color: var(--blush); letter-spacing: 0.1em; }

    .signup-row button {
      border: none; background: var(--terracotta);
      color: var(--warm-white);
      padding: 0.75rem 1.1rem;
      font-family: 'Raleway', sans-serif;
      font-weight: 300; font-size: 0.6rem;
      letter-spacing: 0.25em; text-transform: uppercase;
      cursor: pointer; transition: background 0.25s ease; white-space: nowrap;
    }
    .signup-row button:hover { background: var(--terracotta-lt); }
    .signup-row button:active { background: var(--rose); }

    .thankyou {
      display: none;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 0.95rem;
      color: var(--gold); letter-spacing: 0.05em;
    }

    .domain-line {
      margin-top: 3rem;
      font-family: 'Raleway', sans-serif;
      font-weight: 200; font-size: 0.58rem;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(184,146,74,0.42);
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.7s;
    }

    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(to right,
        var(--terracotta) 0%, var(--gold) 40%,
        var(--rose) 70%, var(--terracotta) 100%);
      opacity: 0.5; z-index: 20;
    }

    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-16px);} to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn   { from { opacity:0; }                              to { opacity:1; } }

    @media (max-width: 480px) {
      .corner { width: 65px; height: 65px; }
      .corner--tl, .corner--tr { top: 10px; }
      .corner--bl, .corner--br { bottom: 10px; }
      .corner--tl, .corner--bl { left: 10px; }
      .corner--tr, .corner--br { right: 10px; }
    }
  </style>
</head>
<body>

<div class="bg"></div>

<!-- Corner ornaments -->
<div class="corner corner--tl"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="8" x2="8" y2="62" stroke="#b8924a" stroke-width="1"/><line x1="8" y1="8" x2="62" y2="8" stroke="#b8924a" stroke-width="1"/><line x1="8" y1="8" x2="30" y2="30" stroke="#b8924a" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.7"/><circle cx="8" cy="8" r="2.5" fill="#b8924a"/><path d="M8 8 Q38 8 38 38" stroke="#b8924a" stroke-width="0.5" fill="none" opacity="0.4"/></svg></div>
<div class="corner corner--tr"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="8" x2="8" y2="62" stroke="#b8924a" stroke-width="1"/><line x1="8" y1="8" x2="62" y2="8" stroke="#b8924a" stroke-width="1"/><line x1="8" y1="8" x2="30" y2="30" stroke="#b8924a" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.7"/><circle cx="8" cy="8" r="2.5" fill="#b8924a"/><path d="M8 8 Q38 8 38 38" stroke="#b8924a" stroke-width="0.5" fill="none" opacity="0.4"/></svg></div>
<div class="corner corner--bl"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="8" x2="8" y2="62" stroke="#b8924a" stroke-width="1"/><line x1="8" y1="8" x2="62" y2="8" stroke="#b8924a" stroke-width="1"/><line x1="8" y1="8" x2="30" y2="30" stroke="#b8924a" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.7"/><circle cx="8" cy="8" r="2.5" fill="#b8924a"/><path d="M8 8 Q38 8 38 38" stroke="#b8924a" stroke-width="0.5" fill="none" opacity="0.4"/></svg></div>
<div class="corner corner--br"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="8" x2="8" y2="62" stroke="#b8924a" stroke-width="1"/><line x1="8" y1="8" x2="62" y2="8" stroke="#b8924a" stroke-width="1"/><line x1="8" y1="8" x2="30" y2="30" stroke="#b8924a" stroke-width="0.6" stroke-dasharray="3 4" opacity="0.7"/><circle cx="8" cy="8" r="2.5" fill="#b8924a"/><path d="M8 8 Q38 8 38 38" stroke="#b8924a" stroke-width="0.5" fill="none" opacity="0.4"/></svg></div>

<main class="wrapper">

  <!-- Sun icon in brand style -->
  <svg class="sun-icon" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#b8924a" stroke-width="1.1" stroke-linecap="round">
      <line x1="60" y1="10" x2="60" y2="1"/>
      <line x1="73" y1="13" x2="79" y2="6"/>
      <line x1="82" y1="22" x2="90" y2="17"/>
      <line x1="86" y1="33" x2="95" y2="33"/>
      <line x1="47" y1="13" x2="41" y2="6"/>
      <line x1="38" y1="22" x2="30" y2="17"/>
      <line x1="34" y1="33" x2="25" y2="33"/>
      <line x1="67" y1="11" x2="71" y2="3"/>
      <line x1="53" y1="11" x2="49" y2="3"/>
      <line x1="77" y1="17" x2="83" y2="11"/>
      <line x1="43" y1="17" x2="37" y2="11"/>
    </g>
    <path d="M34 40 A26 26 0 0 1 86 40 Z" fill="#b8924a" opacity="0.82"/>
    <line x1="10"  y1="40" x2="110" y2="40" stroke="#b8924a" stroke-width="1.1"/>
    <line x1="22"  y1="47" x2="98"  y2="47" stroke="#b8924a" stroke-width="0.8" opacity="0.6"/>
    <line x1="36"  y1="54" x2="84"  y2="54" stroke="#b8924a" stroke-width="0.6" opacity="0.35"/>
    <circle cx="60" cy="62" r="1.5" fill="#b8924a" opacity="0.45"/>
  </svg>

  <div class="wordmark">
    <span class="word-between">Between</span>
    <span class="word-sunsets">Sunsets</span>
  </div>

  <p class="tagline">A Curated Multi-Designer Fashion Platform</p>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line"></div>
  </div>

  <p class="coming-soon">
    Something refined is on its way.<br/>
    We're crafting a destination for those who appreciate the art of dressing well.
  </p>

  <div class="signup-block">
    <p class="signup-label">Be the first to know</p>
    <div class="signup-row" id="signupRow">
      <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email"/>
      <button onclick="handleSignup()">Notify Me</button>
    </div>
    <p class="thankyou" id="thankyou">Thank you — we'll be in touch.</p>
  </div>

  <p class="domain-line">betweensunsets.ae</p>

</main>

<div class="bottom-bar"></div>

<script>
  function handleSignup() {
    const input = document.getElementById('emailInput');
    const row   = document.getElementById('signupRow');
    const ty    = document.getElementById('thankyou');
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim());
    if (!valid) { input.style.outline = '1px solid #b5522a'; input.focus(); return; }
    input.style.outline = '';
    row.style.display = 'none';
    ty.style.display  = 'block';
  }
  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSignup();
  });
</script>

</body>
</html>
